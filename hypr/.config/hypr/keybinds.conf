# https://wiki.hypr.land/Configuring/Binds/
# https://wiki.hypr.land/Configuring/Dispatchers/

$mainMod = SUPER # Sets "Windows" key as main modifier

### --- System --- ###
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod CTRL, Q, exec, hyprctl kill
bind = $mainMod SHIFT, X, exec, $logout
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod SHIFT, M, exec, ~/MKArch/MKArch_switch_monitors 
bind = $mainMod SHIFT, C, exec, ~/MKArch/MKArch_reload_configs

bind = $mainMod, C, exec, hyprpicker -a
bind = $mainMod, Print, exec, hyprshot -m region --clipboard-only
bind = $mainMod SHIFT, Print, exec, hyprshot -m region -o ~/Pictures/screenshots


### --- Navigation --- ###
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d


### --- Workspaces --- ###
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

bind = $mainMod, -, togglespecialworkspace, magic
bind = $mainMod SHIFT, -, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# bind = $mainMod SHIFT CTRL, left, workspace, e-1
# bind = $mainMod SHIFT CTRL, right, workspace, e+1

bind = $mainMod SHIFT, Tab, exec, hypr-cycle previous
bind = $mainMod, Tab, exec, hypr-cycle next


### --- Layout --- ###
bind = $mainMod, F, fullscreen, toggle
bind = $mainMod, G, togglefloating,
bind = $mainMod, H, exec, ~/MKArch/MKArch_sticky_window
# bind = $mainMod, J, rotatesplit, # toggle vert/hori split

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


### --- Programmes --- ###
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, $menu

bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, V, exec, $editor
bind = $mainMod, T, exec, teams-for-linux
bind = $mainMod, Z, exec, zotero

### --- TUIs --- ###
bind = $mainMod CTRL, I, exec, $terminal -e impala 
bind = $mainMod CTRL, B, exec, $terminal -e bluetui 
bind = $mainMod CTRL, T, exec, $terminal -e btop 


### --- Function Keys --- ###
# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindl = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5 --max-volume 150
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume -5 --max-volume 150
bindl = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness +10
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness -10

bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPrev, exec, playerctl previous


### --- Notifications --- ###
# bind = $mainMod CTRL, W, exec, dunstctl history-pop 
# bind = $mainMod CTRL, D, exec, dunstctl close 
# bind = $mainMod CTRL, RETURN, exec, dunstctl action
# bind = $mainMod CTRL, C, exec, dunstctl reload
# bind = $mainMod CTRL, T, exec, dunstify -h int:value:50 bla
# bind = $mainMod CTRL, Y, exec, dunstify -u critical -h int:value:50 bla

bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT CTRL, T, exec, notify-send -n discord "Leon Kennedy" "September 30th, 1998... It's a day I'll never forget. The cop inside me died that day. And that night, Raccoon City was wiped out. Thanks to the bioweapons created by Umbrella. Somehow, I made it out. But too many others...weren't so lucky. I was 'asked' later to join a top-secret government program. Not that I had a choice. The training, the punishing missions nearly killed me. But at least they kept my mind off everything. If I could just forget what happened that night, the pain—even for a second. This time, it can be different. It has to."
bind = $mainMod SHIFT CTRL ALT, T, exec, notify-send -u critical -n discord "Leon Kennedy" "September 30th, 1998... It's a day I'll never forget. The cop inside me died that day. And that night, Raccoon City was wiped out. Thanks to the bioweapons created by Umbrella. Somehow, I made it out. But too many others...weren't so lucky. I was 'asked' later to join a top-secret government program. Not that I had a choice. The training, the punishing missions nearly killed me. But at least they kept my mind off everything. If I could just forget what happened that night, the pain—even for a second. This time, it can be different. It has to."
