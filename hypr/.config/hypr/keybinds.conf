# https://wiki.hypr.land/Configuring/Binds/
# https://wiki.hypr.land/Configuring/Dispatchers/

$mainMod = SUPER # Sets "Windows" key as main modifier

### --- System --- ###
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod SHIFT CTRL, Q, exec, hyprctl kill
bind = $mainMod SHIFT, X, exec, $logout
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, M, exec, ~/MKArch/MKArch_switch_monitors 
bind = $mainMod SHIFT, C, exec, ~/MKArch/MKArch_reload_configs
bind = $mainMod, C, exec, hyprpicker -a


### --- Navigation --- ###
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d


### --- Workspaces --- ###
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = $mainMod SHIFT CTRL, left, workspace, e-1
bind = $mainMod SHIFT CTRL, right, workspace, e+1


### --- Layout --- ###
bind = $mainMod, F, fullscreen, toggle
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # downsize
bind = $mainMod, J, togglesplit, # toggle vert/hori split
# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


### --- Programmes --- ###
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Tab, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, Space, exec, $editor
bind = $mainMod, T, exec, teams-for-linux
bind = $mainMod, Z, exec, zotero

### --- TUIs --- ###
bind = $mainMod SHIFT, I, exec, $terminal -e impala 
bind = $mainMod SHIFT, B, exec, $terminal -e bluetui 
bind = $mainMod SHIFT, T, exec, $terminal -e btop 


### --- Function Keys --- ###
# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindl = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bindl = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness +10
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness -10

bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPrev, exec, playerctl previous


### --- Dunst --- ###
bind = $mainMod CTRL, W, exec, dunstctl history-pop 
bind = $mainMod CTRL, D, exec, dunstctl close 
bind = $mainMod CTRL, RETURN, exec, dunstctl action
bind = $mainMod CTRL, C, exec, dunstctl reload
bind = $mainMod CTRL, T, exec, dunstify -h int:value:50 bla
bind = $mainMod CTRL, Y, exec, dunstify -u critical -h int:value:50 bla